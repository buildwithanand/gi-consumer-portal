<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NTAG213 Writer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f0f0f0;
            text-align: center;
            white-space: pre-wrap;
        }

        .success {
            background: #e5f7e8;
            color: #176b2c;
        }

        .error {
            background: #fde7e7;
            color: #a51d1d;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>NTAG213 Writer</h1>

        <div class="subtitle">
            Write data directly from your Android phone
        </div>

        <label for="batch">
            Batch Number
        </label>

        <input
            type="text"
            id="batch"
            placeholder="Example: BATCH-2026-001"
            maxlength="40"
        >

        <label for="data">
            Data
        </label>

        <textarea
            id="data"
            placeholder="Enter the data you want to store on the NFC tag..."
        ></textarea>

        <button id="writeButton">
            Write to NTAG213
        </button>

        <div id="status" class="status">
            Ready
        </div>

        <div class="info">
            <b>How to use:</b><br><br>

            1. Enter your batch number and data.<br>
            2. Press "Write to NTAG213".<br>
            3. Allow NFC access if requested.<br>
            4. Hold the NTAG213 tag against your phone.<br>
            5. Wait for the success message.
        </div>

    </div>

</div>


<script>

const writeButton = document.getElementById("writeButton");
const statusBox = document.getElementById("status");


function setStatus(message, type = "") {

    statusBox.textContent = message;

    statusBox.className = "status";

    if (type) {
        statusBox.classList.add(type);
    }
}


writeButton.addEventListener("click", async () => {

    // Check Web NFC support

    if (!("NDEFReader" in window)) {

        setStatus(
            "Web NFC is not supported on this browser.\n\n" +
            "Use an NFC-enabled Android phone with Chrome.",
            "error"
        );

        return;
    }


    // Get user data

    const batch = document
        .getElementById("batch")
        .value
        .trim();

    const data = document
        .getElementById("data")
        .value
        .trim();


    if (!batch) {

        setStatus(
            "Please enter a batch number.",
            "error"
        );

        return;
    }


    if (!data) {

        setStatus(
            "Please enter some data.",
            "error"
        );

        return;
    }


    // Create the text that will be stored

    const nfcText =
        "Batch: " + batch + "\n" +
        "Data: " + data;


    // NTAG213 has limited user memory.
    // Keep the payload reasonably small.

    const byteLength =
        new TextEncoder().encode(nfcText).length;


    if (byteLength > 120) {

        setStatus(
            "Data is too large for this NTAG213.\n\n" +
            "Current size: " + byteLength + " bytes\n" +
            "Please shorten the data.",
            "error"
        );

        return;
    }


    try {

        writeButton.disabled = true;

        setStatus(
            "Preparing NFC...\n\n" +
            "Hold the NTAG213 tag against the back of your phone."
        );


        const ndef = new NDEFReader();


        // Start NFC scan/write session

        await ndef.write({

            records: [
                {
                    recordType: "text",
                    data: nfcText
                }
            ]

        });


        setStatus(
            "NFC TAG WRITTEN SUCCESSFULLY!\n\n" +
            nfcText,
            "success"
        );


    } catch (error) {

        console.error(error);

        setStatus(
            "NFC WRITE FAILED\n\n" +
            error.message,
            "error"
        );

    } finally {

        writeButton.disabled = false;

    }

});

</script>

</body>
</html>
